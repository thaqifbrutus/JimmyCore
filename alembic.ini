[alembic]
script_location = alembic
prepend_sys_path = .

# Deliberately no sqlalchemy.url here — env.py pulls it from
# app.config.DATABASE_URL (same source of truth as the app itself),
# so there's no risk of the migration config and the app config
# drifting out of sync or leaking a URL into version control.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
